<script type="text/babel" data-presets="react">
const { useState } = React;

const CalendarIcon = svgWrap(<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>);
const ChevronRight = svgWrap(<polyline points="9 18 15 12 9 6"/>);
const Info = svgWrap(<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>);
const Activity = svgWrap(<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>);

const AlertTriangle = svgWrap(<><path d="m10.29 3.86-8.18 14.18A2 2 0 0 0 4 21h16a2 2 0 0 0 1.89-2.96L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);

function App() {
  const [activeTab, setActiveTab] = useState('timeline');
  const [selectedCycle, setSelectedCycle] = useState(2);
  const [surgeryType, setSurgeryType] = useState('PDS'); // PDS, IDS1, IDS2

  // Simulator State
  const [simStage, setSimStage] = useState('');
  const [simDebulking, setSimDebulking] = useState('');
  const [simBev1st, setSimBev1st] = useState('');
  const [simResponse, setSimResponse] = useState('');
  const [simHrd, setSimHrd] = useState('');

  const resetSimulator = () => {
    setSimStage('');
    setSimDebulking('');
    setSimBev1st('');
    setSimResponse('');
    setSimHrd('');
  };

  const evaluateEligibility = () => {
    if (!simStage || !simBev1st || !simResponse || !simHrd) return null;

    const is1stBevEligible = (simStage === 'IIIb_c' && simDebulking === 'suboptimal') || simStage === 'IV';

    const isMaintEligible = simBev1st === 'yes' && (simResponse === 'CR' || simResponse === 'PR') && simHrd === 'positive';

    return {
      is1stBevEligible,
      isMaintEligible,
    };
  };

  const simResult = evaluateEligibility();

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">
      {/* Header */}
      <header className="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 text-white shadow-lg border-b border-indigo-700/30">

          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">

              </h1>
              <p className="text-slate-300 text-xs sm:text-sm mt-1">
                수술 시점(PDS/IDS)에 따른 투여 스케줄 및 단계별 급여·비급여 적용 기준
              </p>

                <span className="bg-amber-500 text-amber-950 px-1.5 py-0.5 rounded font-bold text-[10px]">원칙 1</span>
                <span className="text-slate-200">1차(Palliative)와 유지요법(Maintenance) 급여 조건은 <strong className="text-white">독립적</strong></span>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="bg-amber-500 text-amber-950 px-1.5 py-0.5 rounded font-bold text-[10px]">원칙 2</span>
                <span className="text-slate-200">1차 비급여 투여 시 베바시주맙 <strong className="text-white">정석 허가용량은 15mg/kg</strong></span>
              </div>
            </div>
          </div>

              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs sm:text-sm font-medium transition-all whitespace-nowrap ${

                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50'
                  : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white'
              }`}
            >
              <CalendarIcon className="w-4 h-4" />
              1. 치료 타임라인 (PDS/IDS)
            </button>
            <button
              onClick={() => setActiveTab('comparison')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs sm:text-sm font-medium transition-all whitespace-nowrap ${
                activeTab === 'comparison'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50'
                  : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white'

            >
              <Layers className="w-4 h-4" />
              2. 1차 vs 유지요법 급여 비교
            </button>
            <button
              onClick={() => setActiveTab('faqs')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs sm:text-sm font-medium transition-all whitespace-nowrap ${
                activeTab === 'faqs'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50'
                  : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white'
              }`}
            >
              <HelpCircle className="w-4 h-4" />

            </button>
            <button
              onClick={() => setActiveTab('simulator')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs sm:text-sm font-medium transition-all whitespace-nowrap ${

                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50'
                  : 'bg-slate-800/60 text-slate-300 hover:bg-slate-800 hover:text-white'

                  <GitBranch className="w-5 h-5 text-indigo-600" />

                </h2>
                <p className="text-xs text-slate-500">수술 시나리오를 선택하여 베바시주맙 병용 시작 시점을 확인하세요.</p>

              <div className="flex flex-wrap gap-2">

                >
                  PDS (초기종양감축술)
                </button>
                <button

                >

                    {surgeryType === 'IDS1' && "IDS Option 1 (C5부터 Bev 병용)"}
                    {surgeryType === 'IDS2' && "IDS Option 2 (Neo Adju 3주기 후 Palliative C2부터 Bev 병용)"}
                  </h3>
                  {surgeryType === 'IDS1' && <p className="text-[11px] text-rose-600 mt-1 font-semibold">*주의: Neo Adjuvant/IDS 표현을 지양하고, 하나의 Palliative(C1-C6) 과정 중 C2-C4에서 Bev을 쓰지 않은 사유를 차팅하는 것이 권장됩니다.</p>}
                </div>
              </div>

              <div className="relative pt-4 pb-8 overflow-x-auto">

                        Neo Adjuvant (1~3주기)

                    <div className={`${surgeryType === 'IDS2' ? 'col-span-3' : 'col-span-4'} bg-teal-100 text-teal-800 py-2 rounded-lg border border-teal-200 relative`}>

                      <span className="block text-[10px] font-normal text-teal-700">독립적 구간</span>
                    </div>
                    <div className={`${surgeryType === 'IDS2' ? 'col-span-4' : 'col-span-5'} bg-indigo-100 text-indigo-900 py-2 rounded-lg border border-indigo-200`}>
                      Maintenance 구간 (PAOLA-1 용법)
                      <span className="block text-[10px] font-normal text-indigo-700">Palliative와 독립적으로 평가</span>
                    </div>
                    <div className="col-span-3 bg-purple-100 text-purple-900 py-2 rounded-lg border border-purple-200">
                      유지요법 - 린파자 단독
                      <span className="block text-[10px] font-normal text-purple-700">최대 24개월까지</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-12 gap-1 mb-6 text-center text-[11px] text-slate-500 font-mono items-center">
                    {surgeryType === 'IDS2' && <div className="col-span-2 bg-slate-100 py-1 rounded">Neo C1~C3</div>}

                    {surgeryType === 'PDS' && <div className="absolute left-0 -ml-3 -top-2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[10px] border-b-rose-600 text-rose-600 font-bold text-xs"><span className="absolute -top-4 -left-6 w-12 text-center">Surgery</span></div>}
                    {surgeryType === 'IDS2' && <div className="absolute left-[16.6%] -ml-3 -top-2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[10px] border-b-rose-600 text-rose-600 font-bold text-xs"><span className="absolute -top-4 -left-6 w-12 text-center">Surgery</span></div>}

                    <div className={`${surgeryType === 'IDS2' ? 'col-span-1' : 'col-span-1'} bg-slate-100 py-1 rounded`}>C1</div>

                    {surgeryType === 'IDS1' ? (
                      <React.Fragment>
                        <div className="col-span-2 bg-slate-100 py-1 rounded relative">C2~C4
                          <div className="absolute right-[33%] -top-2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[10px] border-b-rose-600 text-rose-600 font-bold text-xs z-10"><span className="absolute -top-4 -left-6 w-12 text-center">Surgery</span></div>
                        </div>
                        <div className="col-span-1 bg-slate-100 py-1 rounded border-l-2 border-cyan-500 text-cyan-700 font-bold">C5~C6</div>
                      </React.Fragment>
                    ) : (
                      <div className={`${surgeryType === 'IDS2' ? 'col-span-2' : 'col-span-3'} bg-slate-100 py-1 rounded border-l-2 border-cyan-500 text-cyan-700 font-bold`}>C2~C6 (종료)</div>
                    )}

                    <div className="col-span-1 bg-slate-100 py-1 border-l-2 border-indigo-500 font-bold text-indigo-700">C7 (시작)</div>
                    <div className={`${surgeryType === 'IDS2' ? 'col-span-3' : 'col-span-4'} bg-slate-100 py-1 border-r-2 border-amber-500 font-bold text-amber-700`}>
                      Bev 총 15주기 한도
                    </div>
                    <div className="col-span-3 bg-slate-100 py-1 font-bold text-purple-700">
                      24개월 (린파자 종료)
                    </div>
                  </div>

                  <div className="mb-4">
                    <div className="flex justify-between text-xs font-semibold text-slate-700 mb-1">
                      <span>Paclitaxel + Carboplatin (CP)</span>
                    </div>
                    <div className="h-8 bg-slate-100 rounded-lg overflow-hidden flex">
                      {surgeryType === 'IDS2' && (
                        <div className="w-[16.6%] bg-slate-400 text-white text-xs flex items-center justify-center font-bold border-r border-white/20">
                          Neo 3주기
                        </div>
                      )}
                      <div className={`${surgeryType === 'IDS2' ? 'w-[25%]' : 'w-[33.3%]'} bg-slate-700 text-white text-xs flex items-center justify-center font-bold shadow-inner border-r border-white/20`}>
                        {surgeryType === 'IDS1' ? 'Palliative C1~C6 (중간 수술)' : 'Palliative C1~C6'}
                      </div>
                      <div className={`${surgeryType === 'IDS2' ? 'w-[58.4%]' : 'w-[66.7%]'} bg-slate-100 text-slate-400 text-xs flex items-center px-4 italic`}>
                        화학요법 종료 후 중단
                      </div>
                    </div>
                  </div>

                  <div className="mb-4">
                    <div className="flex flex-col xl:flex-row xl:justify-between xl:items-end text-xs font-semibold text-cyan-900 mb-2 gap-1.5">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="flex items-center gap-1.5 mr-1">
                          <span className="w-2.5 h-2.5 rounded-full bg-cyan-500"></span>
                          Bevacizumab (아바스틴)
                        </span>
                        <span className="flex items-center text-[10px] bg-teal-50 text-teal-800 border border-teal-200 px-2 py-0.5 rounded">
                           <strong className="text-teal-700 mr-1">급여:</strong> 7.5mg/kg (Stage IIIb/c Suboptimal 또는 IV)
                        </span>
                        <span className="flex items-center text-[10px] bg-rose-50 text-rose-800 border border-rose-200 px-2 py-0.5 rounded">
                           <strong className="text-rose-700 mr-1">비급여:</strong> 15mg/kg (조건 미달 시 허가용량)
                        </span>
                      </div>
                      <span className="text-amber-700 font-bold shrink-0">★ 총 15주기 한도 내 급여</span>
                    </div>
                    <div className="h-10 bg-slate-100 rounded-lg overflow-hidden flex relative border border-cyan-200">
                      {surgeryType === 'IDS2' && (
                         <div className="w-[16.6%] bg-slate-200/50 border-r border-slate-300"></div>

                      {surgeryType === 'PDS' || surgeryType === 'IDS2' ? (
                        <React.Fragment>

                          <div className={`${surgeryType === 'IDS2' ? 'w-[16.7%]' : 'w-[25%]'} bg-cyan-500 text-white text-xs flex flex-col justify-center items-center font-bold border-r border-white/30`}>
                            <span>병용 (C2~C6)</span>
                          </div>
                        </React.Fragment>
                      ) : (
                        <React.Fragment>
                          <div className="w-[22.2%] bg-slate-200/50 text-slate-400 text-[9px] flex items-center justify-center border-r border-slate-300 leading-tight">
                            C1~C4<br/>미투여(사유필요)
                          </div>
                          <div className="w-[11.1%] bg-cyan-500 text-white text-xs flex flex-col justify-center items-center font-bold border-r border-white/30">

                      <div className="w-[25%] bg-slate-200 text-slate-500 text-xs flex items-center justify-center font-semibold">

                                <CheckCircle2 className="w-5 h-5 shrink-0" />
                                <span>1차 베바시주맙 급여 (7.5mg/kg) 가능</span>
                              </div>
                            </div>
                          ) : (
                            <div className="flex items-start gap-2 text-rose-400 font-bold text-xs bg-rose-950/30 p-2.5 rounded border border-rose-900/50">
                              <AlertTriangle className="w-4 h-4 shrink-0 mt-0.5" />
                              <div>
                                <span>1차 베바시주맙 급여 불가 (비급여 적용)</span>
                                <p className="text-[11px] font-normal text-rose-200 mt-1">
                                  병기 조건 미충족. <strong className="text-white">비급여 시 정석 허가용량인 15mg/kg 적용 권장</strong>. (이렇게 비급여로 쓰더라도 향후 유지요법 급여 조건은 확보됨)
                                </p>
                              </div>
                            </div>
                          )}
                        </div>

                        <div className={`p-4 rounded-xl border ${
                          simResult.isMaintEligible
                            ? 'bg-indigo-950/90 border-indigo-500 text-white'
                            : 'bg-slate-800/80 border-slate-700 text-slate-300'
                        }`}>
                          <div className="text-[11px] font-bold uppercase text-indigo-300 mb-1">
                            Maintenance 구간: PAOLA-1 유지요법
                          </div>
                          {simResult.isMaintEligible ? (
                            <div>
                              <div className="flex items-center gap-2 text-emerald-300 font-extrabold text-base mb-2">
                                <CheckCircle2 className="w-6 h-6 shrink-0 text-emerald-400" />
                                <span>PAOLA-1 유지요법 급여 적격</span>
                              </div>
                              <div className="bg-indigo-900/60 p-3 rounded-lg border border-indigo-700/50 space-y-2 text-[11px]">
                                {!simResult.is1stBevEligible && (
                                  <p className="text-amber-300 font-bold pb-2 border-b border-indigo-700">
                                    ★ 1차 비급여 환자 안내: 1차 병기 조건 미충족으로 비급여(15mg/kg) 투여를 했더라도, 유지요법은 Palliative와 독립적으로 평가되므로 HRD(+) 및 CR/PR 조건에 의해 린파자+베바시주맙 병용 급여가 정상 적용됩니다.
                                  </p>
                                )}
                                <ul className="space-y-1.5 text-indigo-100 pt-1">
                                  <li className="flex items-start gap-1.5">
                                    <Check className="w-3.5 h-3.5 text-emerald-400 shrink-0 mt-0.5" />
                                    <span><strong>린파자:</strong> 7주기부터 <strong>최대 24개월</strong> 급여</span>
                                  </li>
                                  <li className="flex items-start gap-1.5">
                                    <Check className="w-3.5 h-3.5 text-emerald-400 shrink-0 mt-0.5" />
                                    <span><strong>베바시주맙:</strong> 1차 병용 포함 <strong>총 누적 15주기</strong> 한도 내 급여</span>
                                  </li>
                                </ul>
                              </div>
                            </div>
                          ) : (
                            <div>
                              <div className="flex items-center gap-2 text-rose-400 font-bold text-sm mb-2">
                                <X className="w-5 h-5 shrink-0" />
                                <span>PAOLA-1 유지요법 급여 불가</span>
                              </div>
                              <div className="text-[11px] text-slate-300 space-y-1 bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                                <p className="font-semibold text-amber-300">독립적 요건 미충족 사유:</p>
                                {simBev1st !== 'yes' && <p>• 선행 베바시주맙 투여 이력 없음</p>}
                                {(simResponse !== 'CR' && simResponse !== 'PR') && <p>• 치료 반응(CR/PR) 미달성</p>}
                                {simHrd !== 'positive' && <p>• HRD 양성이 아님</p>}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

      </main>

      <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 text-center text-xs text-slate-500 border-t border-slate-200 pt-6">
        <p>PAOLA-1 (Olaparib + Bevacizumab) & Bevacizumab Reimbursement Clinical Decision Guide</p>
        <p className="mt-1 text-slate-400">ⓒ 2026 Oncology Medical Affairs & Reimbursement Intelligence</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
